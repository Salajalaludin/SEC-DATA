name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgdal-dev libgeos-dev libproj-dev libssl-dev libudunits2-dev libxml2-dev

      - name: Restore R dependencies
        run: Rscript -e "renv::restore(prompt = FALSE)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Python syntax and import smoke
        run: |
          python -m py_compile cilegon_komoditas_shiny/fetch_era5_cds.py
          python -c "from importlib.metadata import version; import cdsapi; print('cdsapi', version('cdsapi'))"

      - name: R syntax smoke
        run: |
          Rscript -e 'files <- c(list.files("R", "[.]R$", full.names = TRUE), list.files("scripts", "[.]R$", full.names = TRUE), list.files("cilegon_komoditas_shiny", "[.]R$", recursive = TRUE, full.names = TRUE), list.files("tests/testthat", "[.]R$", full.names = TRUE)); invisible(lapply(files, parse)); cat("R syntax OK\n")'

      - name: R core and Shiny module bootstrap smoke
        run: |
          Rscript -e 'files <- c(list.files("R", "[.]R$", full.names = TRUE), list.files("cilegon_komoditas_shiny/modules", "[.]R$", full.names = TRUE)); invisible(lapply(files, sys.source, envir = .GlobalEnv)); stopifnot(is.function(build_dashboard_state), is.function(mod_monitoring_server)); cat("R core bootstrap OK\n")'

      - name: Run R tests
        run: Rscript -e "testthat::test_dir('tests/testthat', reporter = 'summary')"
