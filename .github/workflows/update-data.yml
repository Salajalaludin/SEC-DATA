name: Update Market and Climate Caches

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  refresh-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    env:
      BMKG_ADM4: ${{ secrets.BMKG_ADM4 }}
      BMKG_FORECAST_DAYS: ${{ secrets.BMKG_FORECAST_DAYS }}
      GDRIVE_RDS_ID: ${{ secrets.GDRIVE_RDS_ID }}
      CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin Python executable
        run: |
          echo "PYTHON_EXE=$(which python)" >> "$GITHUB_ENV"
          "$(which python)" -c "import sys; print(sys.executable)"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Restore R dependencies
        run: Rscript -e "renv::restore(prompt = FALSE)"

      - name: Install Python packages
        run: |
          "${PYTHON_EXE}" -m pip install --requirement requirements.txt
          "${PYTHON_EXE}" -c "import sys, cdsapi; print(sys.executable); print('cdsapi OK')"

      - name: Write .cdsapirc from GitHub Secrets
        run: |
          umask 077
          printf 'url: %s\nkey: %s\n' "$CDSAPI_URL" "$CDSAPI_KEY" > cilegon_komoditas_shiny/.cdsapirc

      - name: Write .Renviron overrides
        run: |
          umask 077
          printf 'CDSAPIRC_PATH=cilegon_komoditas_shiny/.cdsapirc\nPYTHON_EXE=%s\nERA5_CDS_RECENT_DAYS=45\nERA5_CDS_LAG_DAYS=5\nBMKG_ADM4=%s\nBMKG_FORECAST_DAYS=%s\nGDRIVE_RDS_ID=%s\n' \
            "$PYTHON_EXE" "${BMKG_ADM4:-36.72.07.1001}" "${BMKG_FORECAST_DAYS:-4}" "$GDRIVE_RDS_ID" \
            > cilegon_komoditas_shiny/.Renviron

      - name: Update SAGON cache
        run: |
          Rscript cilegon_komoditas_shiny/update_sagon_daily.R

      - name: Update BMKG cache
        run: |
          Rscript cilegon_komoditas_shiny/update_bmkg_forecast.R

      - name: Update ERA5 cache
        run: |
          Rscript cilegon_komoditas_shiny/update_era5_daily.R

      - name: Commit updated caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cilegon_komoditas_shiny/cache/sagon_daily_long.rds
          git add -f cilegon_komoditas_shiny/cache/bmkg_forecast_daily.rds
          git add -f cilegon_komoditas_shiny/cache/era5_daily.rds
          git add -f cilegon_komoditas_shiny/cache/era5_daily_bandung_cilegon.rds
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh market and climate caches"
          git push

      - name: Remove runtime credentials
        if: always()
        run: rm -f cilegon_komoditas_shiny/.cdsapirc cilegon_komoditas_shiny/.Renviron cilegon_komoditas_shiny/.Renviron.github

